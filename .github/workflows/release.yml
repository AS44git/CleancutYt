# Builds CleancutYt from the stock YouTube APK and publishes it as a GitHub release, which is
# what the in-app updater checks. One APK per release: cleancutyt-<tag>.apk (package
# app.morphe.android.youtube, signs in through MicroG RE).
#
# Run it from the Actions tab ("Build and release" -> Run workflow).
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   your signing keystore, base64-encoded
#   KEYSTORE_PASS     the keystore password
#   KEY_PASS          the key password (optional, defaults to KEYSTORE_PASS)
#   KEY_ALIAS         the key's alias (optional: the keystore's first key is used)
#
# Always sign with the same keystore: Android refuses an update signed with a different key.
#
# The tag is YouTube's version plus Brand.REVISION (extensions/youtube/.../cleancut/Brand.java):
# YouTube 21.30.216 at revision 1 -> v21-30-216-1. Bump REVISION for each new release.

name: Build and release

on:
  workflow_dispatch:
    inputs:
      stock_apk:
        description: "Stock YouTube APK: release:NAME (an .apk on that release, drafts too) or a direct https:// link"
        required: true
        default: "release:stock-apk"
      notes:
        description: "Release notes (shown in the app's update dialog)"
        required: false
        default: ""
      app_name:
        description: "Name under the app icon"
        required: false
        default: "Youtube"
      prerelease:
        description: "Mark as a pre-release (the updater only offers the latest full release)"
        type: boolean
        default: false
      morphe_cli_version:
        description: "Morphe CLI (morphe-desktop) release tag"
        required: false
        default: "v1.20.0"

permissions:
  contents: write
  packages: read

env:
  YOUTUBE_SIGNERS: "5aad2bee6db95d17e05a08d7d1e64c10a1511879154483916b6ae6c7fd9cb0c6 3d7a1223019aa39d9ea0e3436ab7c0896bfb4fb679f4de5fe7c23f326c8f994a"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::KEYSTORE_BASE64 and KEYSTORE_PASS must be set. Releases are signed with your own key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          alias="$KEY_ALIAS"
          if [ -z "$alias" ]; then
            alias="$(keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASS" \
              | sed -n 's/^Alias name: //p' | head -1)"
          fi
          if [ -z "$alias" ]; then echo "::error::No key found in the keystore"; exit 1; fi
          echo "signing with key alias: $alias"
          echo "KEY_ALIAS_RESOLVED=$alias" >> "$GITHUB_ENV"

      - name: Build the patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          chmod +x gradlew morphe-patches-library/gradlew
          ./gradlew --no-daemon --stacktrace :patches:buildAndroid
          echo "BUNDLE=$(ls -t patches/build/libs/*.mpp | head -1)" >> "$GITHUB_ENV"

      - name: Fetch the Morphe CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools/cli
          gh release download "${{ inputs.morphe_cli_version }}" -R MorpheApp/morphe-cli -p '*.jar' -D tools/cli/
          echo "CLI=$(ls -S tools/cli/*.jar | head -1)" >> "$GITHUB_ENV"

      - name: Fetch and verify the stock YouTube APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="$(bash .github/scripts/fetch-stock-apk.sh "${{ inputs.stock_apk }}")"
          apksigner="$(ls -t "$ANDROID_HOME"/build-tools/*/apksigner | head -1)"
          signer="$("$apksigner" verify --print-certs "$file" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)"
          case " $YOUTUBE_SIGNERS " in
            *" $signer "*) ;;
            *) echo "::error::$file is not signed by YouTube (got $signer). Use the untouched APKMirror download."; exit 1 ;;
          esac
          echo "STOCK_APK=$file" >> "$GITHUB_ENV"
          echo "APKSIGNER=$apksigner" >> "$GITHUB_ENV"

      - name: Patch YouTube
        run: |
          mkdir -p dist build
          java -Xmx5g -jar "$CLI" patch \
            -p "$BUNDLE" \
              -e "Custom branding" -OcustomName="${{ inputs.app_name }}" -OappIcon=original \
            --striplibs arm64-v8a \
            -r build/patch-result.json \
            -o dist/unsigned.apk \
            "$STOCK_APK"
          python3 - build/patch-result.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          name = lambda p: p if isinstance(p, str) else p.get("name")
          applied = [name(p) for p in r.get("appliedPatches", [])]
          failed = [name(p) for p in r.get("failedPatches", [])]
          print(len(applied), "applied,", len(failed), "failed", failed)
          if "CleancutTube" not in applied: sys.exit("the CleancutTube patch did not apply")
          PY

      - name: Sign with the release key
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS || secrets.KEYSTORE_PASS }}
        run: |
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS_RESOLVED" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out dist/signed.apk dist/unsigned.apk
          "$APKSIGNER" verify dist/signed.apk
          rm dist/unsigned.apk "$RUNNER_TEMP/release.keystore"

      - name: Work out the version
        run: |
          aapt2="$(ls -t "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)"
          version="$("$aapt2" dump badging dist/signed.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          if [ -z "$version" ]; then echo "::error::could not read versionName"; exit 1; fi
          brand=extensions/youtube/src/main/java/app/morphe/extension/youtube/cleancut/Brand.java
          revision="$(sed -n 's/.*int REVISION = \([0-9][0-9]*\);.*/\1/p' "$brand")"
          if [ -z "$revision" ]; then echo "::error::could not read REVISION from Brand.java"; exit 1; fi
          tag="v${version//./-}-$revision"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          mv dist/signed.apk "dist/cleancutyt-$tag.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist; cat dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump REVISION in Brand.java for a new release."
            exit 1
          fi
          args=("$TAG" dist/*.apk dist/SHA256SUMS.txt --title "CleancutYt $TAG")
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--notes "CleancutYt $TAG. Needs MicroG RE (GmsCore) to sign in."); fi
          [ "${{ inputs.prerelease }}" = "true" ] && args+=(--prerelease)
          gh release create "${args[@]}"
